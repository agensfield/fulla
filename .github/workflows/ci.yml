name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Fish runtime acceptance dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fish
      - name: Required Fish completion behavior
        if: runner.os == 'Linux'
        env:
          FULLA_REQUIRE_FISH: "1"
        run: go test ./internal/cli -run 'TestFishCompletionBehavior|TestCompletionWithoutStoreAndShellSyntax' -v
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Race and integration tests
        run: go test -race ./...
      - name: Explicit development panic diagnostics
        run: go test -race -tags fulla_debug ./internal/cli -run '^TestPanicProcess' -count=1
      - name: Repeated initialization and pruning acceptance
        run: go test -race ./internal/cli -run ^TestBackupPruneCLIPreviewsBeforeExplicitApplication$ -count=20
      - name: Static analysis
        run: go vet ./...
      - name: Controlling-terminal acceptance
        run: |
          go build -o dist/fulla .
          go test -c -o dist/age-plugin-fullafixture ./internal/crypt
          python3 scripts/diagnose-plugin-shutdown.py dist/fulla dist/age-plugin-fullafixture --expect-cleanup
          python3 scripts/acceptance-interactive.py dist/fulla
          python3 scripts/acceptance-clipboard.py dist/fulla
      - name: Authorized noninteractive agent journey
        run: python3 scripts/acceptance-agent.py dist/fulla
      - name: Checkout pinned shell-pa predecessor
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: ardasevinc/pa
          ref: f75734b8775f72d5d2f9630c08c2b48bdb6d8104
          path: dist/pa-predecessor
          persist-credentials: false
      - name: Real shell-pa adoption and rollback
        shell: bash
        run: |
          GOBIN="$PWD/dist/pa-tools" go install filippo.io/age/cmd/age@v1.3.2
          GOBIN="$PWD/dist/pa-tools" go install filippo.io/age/cmd/age-keygen@v1.3.2
          go build -o dist/acceptance-sshd ./scripts/acceptance-sshd
          python3 scripts/acceptance-pa.py dist/fulla dist/pa-predecessor dist/pa-tools dist/acceptance-sshd
      - name: Checkout historical Fulla CLI
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 831caf68655b41b4ca5b064b7693af35df68a6e6
          path: dist/fulla-predecessor
          persist-credentials: false
      - name: Build historical Fulla CLI
        working-directory: dist/fulla-predecessor
        env:
          GOWORK: "off"
        run: go build -o ../fulla-predecessor-bin .
      - name: Historical Fulla upgrade and basic rollback
        run: |
          go test -c -o dist/fulla-store-fixture ./internal/store
          python3 scripts/acceptance-upgrade.py dist/fulla-predecessor-bin dist/fulla dist/fulla-store-fixture
      - name: Isolated X11 clipboard dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xclip xauth
      - name: Real clipboard acceptance (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 scripts/acceptance-clipboard.py dist/fulla --real-clipboard
      - name: Real clipboard acceptance (macOS)
        if: runner.os == 'macOS'
        run: python3 scripts/acceptance-clipboard.py dist/fulla --real-clipboard
      - name: Reproducible four-platform packages and native smoke
        shell: bash
        run: |
          go run ./scripts/release --output dist/packages-a
          go run ./scripts/release --output dist/packages-b
          diff -r dist/packages-a dist/packages-b
          python3 scripts/acceptance-release.py dist/packages-a "$(go run . --version)"
      - name: Retain verified release packages
        if: runner.os == 'Linux' && github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fulla-release-${{ github.sha }}
          path: dist/packages-a/*
          if-no-files-found: error
          retention-days: 7
