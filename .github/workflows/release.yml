name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: fulla-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    if: github.repository == 'agensfield/fulla'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      preview: ${{ steps.source.outputs.preview }}
      notes: ${{ steps.source.outputs.notes }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Verify tag, source, version, and notes
        id: source
        shell: bash
        run: |
          metadata=$(go run ./scripts/release --check-tag "$GITHUB_REF_NAME" --event-sha "$GITHUB_SHA")
          jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$metadata" >> "$GITHUB_OUTPUT"

  acceptance:
    needs: source
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: [source, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
      RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
      RELEASE_PREVIEW: ${{ needs.source.outputs.preview }}
      RELEASE_NOTES: ${{ needs.source.outputs.notes }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fulla-release-${{ github.sha }}
          path: dist/release
      - name: Verify the tested package set
        run: python3 scripts/acceptance-release.py dist/release "$RELEASE_VERSION"
      - name: Attest tested artifact digests
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*
          create-storage-record: false
      - name: Verify provenance before upload
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: |
          cp "$ATTESTATION_BUNDLE" dist/attestation.jsonl
          for artifact in dist/release/*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --bundle dist/attestation.jsonl \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --signer-digest "$RELEASE_COMMIT" \
              --source-digest "$RELEASE_COMMIT" --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          done
      - name: Create a new draft with verified assets
        shell: bash
        run: |
          git fetch --no-tags origin "refs/tags/$GITHUB_REF_NAME"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_COMMIT"
          gh release create "$GITHUB_REF_NAME" dist/release/* dist/attestation.jsonl \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$RELEASE_COMMIT" \
            --title "Fulla $GITHUB_REF_NAME" --notes-file "$RELEASE_NOTES" \
            --draft --prerelease="$RELEASE_PREVIEW" --latest=false
      - name: Verify downloaded draft assets
        shell: bash
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir dist/downloaded --pattern 'fulla_*.tar.gz' --pattern checksums.txt
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir dist/downloaded-attestation --pattern attestation.jsonl
          python3 scripts/acceptance-release.py dist/downloaded "$RELEASE_VERSION"
          for artifact in dist/downloaded/*; do
            cmp "$artifact" "dist/release/$(basename "$artifact")"
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --bundle dist/downloaded-attestation/attestation.jsonl \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --signer-digest "$RELEASE_COMMIT" \
              --source-digest "$RELEASE_COMMIT" --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          done
      - name: Publish verified draft
        shell: bash
        run: |
          git fetch --no-tags origin "refs/tags/$GITHUB_REF_NAME"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_COMMIT"
          latest=true
          if [ "$RELEASE_PREVIEW" = true ]; then latest=false; fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft=false --prerelease="$RELEASE_PREVIEW" --latest="$latest"
