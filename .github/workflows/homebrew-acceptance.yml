name: Homebrew installation acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    if: github.repository == 'agensfield/fulla'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Install and test disposable formula
        run: python3 scripts/acceptance-homebrew.py
      - name: Retain installation receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: homebrew-${{ github.run_id }}
          path: dist/homebrew-receipt.json
          if-no-files-found: error
          retention-days: 14
